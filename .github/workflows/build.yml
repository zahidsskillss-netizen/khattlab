name: Build KhattLab APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body=$(grep -E "^e: |error:|What went wrong|FAILED|Exception" -A4 build.log | head -c 60000)
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -f body="Build errors:
          \`\`\`
          $body
          \`\`\`"

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk KhattLab.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KhattLab-apk
          path: KhattLab.apk

      - name: Publish release (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: KhattLab (build ${{ github.run_number }})
          files: KhattLab.apk
          make_latest: true
